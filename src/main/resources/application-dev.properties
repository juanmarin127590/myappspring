# ===================================================================
# DEVELOP ENVIRONMENT CONFIGURATION (Perfil: dev)
# ===================================================================

server.port=8080

# Database Configuration (Development Database)
spring.datasource.url=jdbc:mysql://localhost:3306/connect_shop_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# H2 Console (Enabled for local debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.connectshop=DEBUG

# JWT Configuration (Development Keys)
jwt.secret=DevSecretKeyForJWTTokenGenerationWhichIsAtLeast256BitsLong1234567890!
jwt.expiration=86400000
