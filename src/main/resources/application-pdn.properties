# ===================================================================
# PDN / PRODUCTION ENVIRONMENT CONFIGURATION (Perfil: pdn)
# ===================================================================

server.port=${PORT:8080}

# Database Configuration (Production Database with ENV variable overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/connect_shop_prod?useSSL=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console (Disabled in Production)
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.org.springframework=WARN
logging.level.com.connectshop=WARN

# JWT Configuration (Production Key from ENV)
jwt.secret=${JWT_SECRET:ProductionUltraSecureSecretKeyForJWTTokenGenerationWhichIsAtLeast256BitsLongStrictKey2026!}
jwt.expiration=86400000
