# ===================================================================
# QA ENVIRONMENT CONFIGURATION (Perfil: qa)
# ===================================================================

server.port=8080

# Database Configuration (QA Database)
spring.datasource.url=jdbc:mysql://localhost:3306/connect_shop_qa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# H2 Console (Disabled in QA environment)
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.connectshop=INFO

# JWT Configuration (QA Staging Keys)
jwt.secret=QAStagingSecretKeyForJWTTokenGenerationWhichIsAtLeast256BitsLong9876543210!
jwt.expiration=43200000
